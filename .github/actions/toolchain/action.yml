name: the build toolchain
description: Python, the build toolchain from its cache or installed, and the built libraries from their cache

outputs:
  libraries-hit:
    description: "'true' when the built libraries came from the cache"
    value: ${{ steps.libraries.outputs.cache-hit }}
  libraries-key:
    description: The key to save the built libraries under
    value: ${{ steps.libraries.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.11"
        cache: pip
    # wasi-sdk and Rust with its tools, which follow from the icpp-pro version alone
    - name: the icpp-pro version
      id: icpp
      shell: bash
      run: |
        version=$(grep -x 'icpp-pro==[^ ]*' requirements.txt)
        echo "version=$version" >>"$GITHUB_OUTPUT"
    - name: restore the toolchain
      id: toolchain
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.icpp
        key: icpp-${{ runner.os }}-${{ steps.icpp.outputs.version }}
    - name: install the toolchain
      shell: bash
      env:
        TOOLCHAIN_RESTORED: ${{ steps.toolchain.outputs.cache-hit }}
      run: |
        pip install -r requirements.txt
        # The toolchain reinstalls these even when they are there, so only
        # when the cache, keyed on its version, did not bring them
        if [ "$TOOLCHAIN_RESTORED" != true ]; then
          icpp install-wasi-sdk
          icpp install-rust
        fi
    - name: save the toolchain
      if: steps.toolchain.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.icpp
        key: ${{ steps.toolchain.outputs.cache-primary-key }}
    # The vendored and toolchain libraries, keyed on the stamps the Makefile
    # checks, so a cache that is found holds what the build would make. The
    # release and the reproducible build never use it.
    - name: the library stamps
      id: stamps
      shell: bash
      run: |
        stamps=$(make -s library-stamps)
        test "$(grep -cx '[0-9a-f]\{64\}' <<<"$stamps")" = 3
        echo "hash=$(shasum -a 256 <<<"$stamps" | cut -c1-64)" >>"$GITHUB_OUTPUT"
    - name: restore the built libraries
      id: libraries
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ env.LIBRARY_DIRS }}
        key: libraries-${{ runner.os }}-${{ steps.stamps.outputs.hash }}
