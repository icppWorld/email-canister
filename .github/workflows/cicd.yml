name: cicd

on:
  workflow_dispatch:
    inputs:
      reproducible-build:
        description: "Also run the reproducible Docker build (about 10 minutes)"
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ICP_CLI_VERSION: "1.8.0"
  DIDC_VERSION: "0.6.2"
  DIDC_SHA256: "9990d2646a2b023df50c8765fd34e43951ba947303d3ce9d06590b2d58e89469"

jobs:
  neutral:
    # A pull request from a fork gets no secrets, so it cannot run this check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: names that must stay out of the project
        env:
          NEUTRAL_DENYLIST_TEXT: ${{ secrets.NEUTRAL_DENYLIST_TEXT }}
        run: scripts/check-neutral.sh

  # Formatters, linters and type checkers: make check-static
  static:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webmail/package-lock.json
      - name: install the tools
        run: |
          pip install -r requirements.txt
          icpp install-wasi-sdk # its clang-format
          (cd webmail && npm ci)
      - name: static checks
        run: make check-static
      # Here and not in `tests`: they read docs and version strings too
      - name: Python tests
        run: make test-python

  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webmail/package-lock.json
      # wasi-sdk and Rust with its tools, which icpp installs only when missing
      - name: cache the toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.icpp
          key: icpp-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      # The network launcher and the wasms icp fetches, such as its sync plugin
      - name: cache icp's downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/icp-cli/pkg
          key: icp-pkg-${{ runner.os }}-${{ env.ICP_CLI_VERSION }}-${{ hashFiles('icp.yaml') }}
      # The vendored and toolchain libraries. The Makefile builds them again
      # anyway when its stamp does not match, so a stale cache costs only time.
      # The release and the reproducible build never use it.
      - name: restore the built libraries
        id: libraries
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build-library
            build-library-native
            test/relay_stub/build-library
          key: libraries-${{ runner.os }}-${{ hashFiles('requirements.txt', 'icpp.toml', 'icpp-test.toml', 'vendor/**', 'shims/**', 'src/store/sqlite_vfs.c', 'test/relay_stub/icpp.toml') }}
      - name: install the toolchain
        run: |
          pip install -r requirements.txt
          icpp install-wasi-sdk
          icpp install-rust
          npm install -g @icp-sdk/icp-cli@${ICP_CLI_VERSION}
          (cd webmail && npm ci)
          # didc, which the native tests encode and decode Candid with
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/didc.tar.xz "https://github.com/dfinity/candid/releases/download/didc-v${DIDC_VERSION}/didc-x86_64-unknown-linux-gnu.tar.xz"
          echo "${DIDC_SHA256}  /tmp/didc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/didc.tar.xz -C /tmp
          sudo install /tmp/didc-x86_64-unknown-linux-gnu/didc /usr/local/bin/didc
          # The tests use the runner's own Google Chrome (channel "chrome"),
          # so nothing is installed from the Ubuntu mirrors
          google-chrome --version
      - name: build
        run: make build-all build-relay-stub
      - name: native tests
        run: make test-native
      # Saved once the native libraries are built too, and even when a later
      # test fails
      - name: save the built libraries
        if: steps.libraries.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build-library
            build-library-native
            test/relay_stub/build-library
          key: ${{ steps.libraries.outputs.cache-primary-key }}
      - name: domain canister tests
        run: make test-domain
      - name: start a local replica
        run: |
          icp identity new email-canister-test --storage plaintext >/dev/null
          icp network start -d
      - name: replica tests
        env:
          GH_TOKEN: ${{ github.token }} # downloads a past release to upgrade from
        run: make test-canister
      - name: webmail tests
        run: make test-e2e

  # The relay bridge in a Caffeine-style app on PocketIC, in its own container
  bridge:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: relay bridge tests
        run: make test-bridge

  # Slow: it builds the whole toolchain image. Pull requests get the native
  # build in `tests`; main gets this one, and a manual run when asked for.
  reproducible-build:
    if: github.event_name == 'push' || inputs.reproducible-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: build the toolchain image
        run: make docker-build-base
      - name: build the wasm and the webmail
        run: make docker-build
      - name: hashes
        run: |
          echo "wasm    $(cat out/email-canister.wasm.sha256)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "webmail $(cat out/webmail/dist.sha256)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build
          path: out/
