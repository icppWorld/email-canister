name: cicd

on:
  workflow_dispatch:
    inputs:
      reproducible-build:
        description: "Also run the reproducible Docker build (about 10 minutes)"
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ICP_CLI_VERSION: "1.8.0"
  DIDC_VERSION: "0.6.2"
  DIDC_SHA256: "9990d2646a2b023df50c8765fd34e43951ba947303d3ce9d06590b2d58e89469"
  # The library folders the Makefile builds, cached between runs
  LIBRARY_DIRS: |
    build-library
    build-library-native
    test/relay_stub/build-library

jobs:
  neutral:
    # A pull request from a fork gets no secrets, so it cannot run this check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: names that must stay out of the project
        env:
          NEUTRAL_DENYLIST_TEXT: ${{ secrets.NEUTRAL_DENYLIST_TEXT }}
        run: scripts/check-neutral.sh

  # Formatters, linters and type checkers: make check-static
  static:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webmail/package-lock.json
      - name: install the tools
        run: |
          pip install -r requirements.txt
          icpp install-wasi-sdk # its clang-format
          (cd webmail && npm ci)
      - name: static checks
        run: make check-static
      # Here, as they read docs and version strings too
      - name: Python tests
        run: make test-python
      - name: domain canister tests
        run: make test-domain

  # Whether the build and the tests run, and the tree this run tests. They are
  # skipped for a pull request that changes only docs, which `static` checks,
  # and for a push to main whose tree the run of the pull request it merges
  # passed. That run tested the merge commit, whose first parent is the base
  # it was built on
  changes:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      run-tests: ${{ steps.decide.outputs.run-tests }}
      tree: ${{ steps.decide.outputs.tree }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >>"$GITHUB_OUTPUT"
          run=true
          if [ "$EVENT" = pull_request ]; then
            # A renamed file under both names, so code moved into docs/ counts
            files=$(git diff --no-renames --name-only 'HEAD^1' HEAD)
            if [ -n "$files" ] && ! grep -qvE '^docs/|\.md$' <<<"$files"; then
              run=false
              echo "Only docs changed"
            fi
          elif [ "$EVENT" = push ]; then
            # Skipped only when the pull request this push merges passed it
            run=$(scripts/passed-tree.sh "$tree" | sed -n 's/^run-tests=//p')
            [ "$run" = false ] || run=true
          fi
          echo "run-tests=$run" >>"$GITHUB_OUTPUT"

  # The test wasms, once, for the jobs that test them
  build:
    needs: changes
    if: needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/toolchain
      - name: build the test wasms
        run: make build-test-all build-relay-stub
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-wasms
          path: |
            build/email-canister-test.wasm
            test/relay_stub/build/relay_stub.wasm
          if-no-files-found: error
          retention-days: 3
          overwrite: true # a re-run of this job

  # The production build, which the tests do not deploy, and the test build on
  # the Mock IC. It saves the built libraries for the next run: it builds all
  # of them.
  # Also on every push to main: main's caches are the ones every pull request
  # can restore, and this job saves the toolchain and the libraries
  native:
    needs: changes
    if: needs.changes.outputs.run-tests == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: toolchain
        uses: ./.github/actions/toolchain
      # didc, which the native tests encode and decode Candid with
      - name: install didc
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/didc.tar.xz "https://github.com/dfinity/candid/releases/download/didc-v${DIDC_VERSION}/didc-x86_64-unknown-linux-gnu.tar.xz"
          echo "${DIDC_SHA256}  /tmp/didc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/didc.tar.xz -C /tmp
          sudo install /tmp/didc-x86_64-unknown-linux-gnu/didc /usr/local/bin/didc
      - name: build everything
        run: make build-all build-relay-stub
      - name: native tests
        run: make test-native
      # Also when a native test failed, but only once every library folder holds
      # the stamp the Makefile writes after a build of it succeeds
      - name: the built libraries are complete
        id: libraries-built
        if: ${{ !cancelled() && steps.toolchain.outputs.libraries-hit != 'true' }}
        run: |
          for dir in $LIBRARY_DIRS; do test -f "$dir/built" || exit 0; done
          echo "complete=true" >>"$GITHUB_OUTPUT"
      - name: save the built libraries
        if: ${{ !cancelled() && steps.libraries-built.outputs.complete == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.LIBRARY_DIRS }}
          key: ${{ steps.toolchain.outputs.libraries-key }}

  # The tests on a local replica, by module, each part on a replica of its own
  replica-tests:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each module reinstalls the canister, so any can run in any part. A new
        # module joins the last part
        include:
          - part: outbox
            tests: test/canister/test_outbox.py
          - part: check and export
            tests: test/canister/test_check.py test/canister/test_export.py
          - part: the other modules
            tests: >-
              test/canister --ignore=test/canister/test_outbox.py
              --ignore=test/canister/test_check.py --ignore=test/canister/test_export.py
    name: replica tests (${{ matrix.part }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/replica
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install the test tools
        run: pip install -r requirements.txt
      - name: replica tests
        env:
          GH_TOKEN: ${{ github.token }} # downloads a past release to upgrade from
          CANISTER_TESTS: ${{ matrix.tests }}
        run: make test-canister

  # Playwright shares the spec files out over the jobs, whole files, so each
  # file's tests still run in order on one replica
  webmail-tests:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: webmail tests (${{ matrix.shard }} of 3)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: replica
        uses: ./.github/actions/replica
      # The tests use the runner's own Google Chrome (channel "chrome"), so
      # nothing is installed from the Ubuntu mirrors
      - name: install the webmail
        run: |
          (cd webmail && npm ci)
          google-chrome --version
      - name: webmail tests
        run: make test-e2e
        env:
          E2E_ARGS: --shard=${{ matrix.shard }}/3
      # Once the webmail tests have fetched the sync plugin, and only when they
      # passed, so a download cut off half way is not kept. Any job that passed
      # saves it; the jobs after the first find the key taken and skip
      - name: save icp's downloads
        if: steps.replica.outputs.icp-pkg-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/icp-cli/pkg
          key: ${{ steps.replica.outputs.icp-pkg-key }}

  # The relay bridge in a Caffeine-style app on PocketIC, in its own container
  bridge:
    needs: changes
    if: needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: relay bridge tests
        run: make test-bridge

  # Marks the tree as passed, for the push to main that merges it, once every
  # job above passed; a job skipped skips this one too. A fork's pull request
  # skips `neutral`, and the push checks the run's repository as well
  passed:
    if: github.event_name == 'pull_request'
    needs: [changes, neutral, static, build, native, replica-tests, webmail-tests, bridge]
    runs-on: ubuntu-22.04
    steps:
      - name: the tree this run passed
        env:
          TREE: ${{ needs.changes.outputs.tree }}
        run: echo "$TREE" >passed-tree
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: passed-tree-${{ needs.changes.outputs.tree }}
          path: passed-tree
          if-no-files-found: error
          # a re-run of this job
          overwrite: true
          # A pull request merged later is tested again on main: a result
          # also depends on the runner, the releases and what was downloaded
          retention-days: 7

  # Slow: it builds the whole toolchain image. Pull requests get the builds in
  # `build` and `native`; main gets this one, and a manual run when asked for.
  reproducible-build:
    if: github.event_name == 'push' || inputs.reproducible-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: build the toolchain image
        run: make docker-build-base
      - name: build the wasm and the webmail
        run: make docker-build
      - name: hashes
        run: |
          echo "wasm    $(cat out/email-canister.wasm.sha256)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "webmail $(cat out/webmail/dist.sha256)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build
          path: out/
